<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Halloween</title>
    
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Carga de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Creepster&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Configuración del fondo y fuentes generales */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            color: white;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Animación del Rayo / Relámpago */
        .lightning {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.1), rgba(255,255,255,0.5));
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: flash 4s infinite;
            border-radius: inherit;
        }

        .lightning-bolt {
            position: absolute;
            right: 16%;
            top: 2%;
            width: 42px;
            height: 220px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.5) 35%, rgba(255,255,255,0.25) 100%);
            clip-path: polygon(46% 0%, 60% 0%, 52% 26%, 74% 26%, 18% 100%, 34% 62%, 10% 62%);
            filter: drop-shadow(0 0 16px rgba(255,255,255,0.95));
            transform: rotate(18deg) skewY(-6deg);
            opacity: 0;
            z-index: 2;
            animation: boltFlash 4s infinite;
        }

        /* Tiempos clave para simular un relámpago realista */
        @keyframes flash {
            0%, 12%, 14%, 16%, 18%, 42%, 44%, 100% { opacity: 0; }
            13% { opacity: 0.7; }
            15% { opacity: 0.18; }
            17% { opacity: 0.85; }
            43% { opacity: 0.55; }
        }

        @keyframes boltFlash {
            0%, 12%, 14%, 16%, 18%, 42%, 44%, 100% {
                opacity: 0;
                transform: rotate(18deg) skewY(-6deg) scale(0.92);
            }
            13% {
                opacity: 0.95;
                transform: rotate(18deg) skewY(-6deg) scale(1.05);
            }
            15% {
                opacity: 0.28;
                transform: rotate(18deg) skewY(-6deg) scale(0.96);
            }
            17% {
                opacity: 1;
                transform: rotate(18deg) skewY(-6deg) scale(1.08);
            }
            43% {
                opacity: 0.75;
                transform: rotate(18deg) skewY(-6deg) scale(1.03);
            }
        }

        /* Contenedor central (Tarjeta flotante) */
        .glass-card {
            position: relative;
            z-index: 10;
            overflow: hidden;
            background-image: linear-gradient(rgba(5, 5, 10, 0.7), rgba(5, 5, 10, 0.9)), url('https://images.pexels.com/photos/5435188/pexels-photo-5435188.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 120, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 100, 0, 0.15);
            width: min(92vw, 560px);
            max-width: 560px;
            padding: 1.4rem 0.9rem 1.2rem;
            border-radius: 1.35rem;
            animation: none;
        }

        .title-glow {
            display: inline-block;
            animation: titleFloat 3.2s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255, 100, 0, 0.7);
        }

        .title-glow span {
            display: inline-block;
            animation: letterMelt 3.2s ease-in-out infinite;
            will-change: transform, opacity, filter;
        }

        .wave-text {
            display: inline-block;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        .wave-text span {
            display: inline-block;
            animation: waveLetter 1.8s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.08s);
            will-change: transform, opacity;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes letterMelt {
            0%, 100% {
                transform: translateY(0) scaleY(1);
                opacity: 1;
                filter: blur(0px);
            }
            25% {
                transform: translateY(-3px) scaleY(1.08);
                opacity: 0.95;
                filter: blur(0.2px);
            }
            50% {
                transform: translateY(2px) scaleY(0.94);
                opacity: 0.88;
                filter: blur(0.8px);
            }
            75% {
                transform: translateY(-2px) scaleY(1.04);
                opacity: 0.98;
                filter: blur(0.4px);
            }
        }

        @keyframes waveLetter {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            25% {
                transform: translateY(-4px) scale(1.04);
                opacity: 1;
            }
            50% {
                transform: translateY(2px) scale(0.98);
                opacity: 0.9;
            }
            75% {
                transform: translateY(-2px) scale(1.02);
                opacity: 0.98;
            }
        }

        /* Clases de tipografía personalizadas */
        .font-creepster {
            font-family: 'Creepster', cursive;
        }
        .font-cormorant {
            font-family: 'Cormorant Garamond', serif;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
        }

        @media (max-width: 420px) {
            .info-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .glass-card {
                width: min(94vw, 420px);
                padding: 1.1rem 0.7rem 0.95rem;
                border-radius: 1.2rem;
            }

            h1 {
                margin-bottom: 1.2rem !important;
            }

            .mobile-tight {
                padding: 0.7rem 0.7rem !important;
            }

            .mobile-label {
                letter-spacing: 0.12em !important;
            }

            .mobile-value {
                font-size: 1.05rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- Tarjeta Principal -->
    <div class="glass-card">
        <!-- Capa del efecto relámpago -->
        <div class="lightning"></div>
        <div class="lightning-bolt"></div>
        
        <!-- Título -->
        <h1 class="font-creepster text-5xl md:text-6xl text-orange-500 text-center mb-8 drop-shadow-xl title-glow mx-auto block" style="text-shadow: 0 0 15px rgba(255, 100, 0, 0.7);">
            <span>F</span><span>i</span><span>e</span><span>s</span><span>t</span><span>a</span> <span>d</span><span>e</span><br>
            <span>H</span><span>a</span><span>l</span><span>l</span><span>o</span><span>w</span><span>e</span><span>e</span><span>n</span>
        </h1>
        
        <!-- Contenedor de Datos -->
        <div class="space-y-3">
            <div class="info-grid">
                <!-- Fila Fecha -->
                <div class="mobile-tight flex items-center space-x-3 bg-black/40 p-3 rounded-xl border border-white/5">
                    <span class="text-2xl drop-shadow-md opacity-90">📅</span>
                    <div>
                        <span class="mobile-label block text-[10px] md:text-xs text-orange-400 font-bold uppercase tracking-[0.2em] mb-0.5">Fecha</span>
                        <span class="mobile-value font-cormorant text-lg md:text-2xl text-gray-100 font-bold leading-none">Viernes 30/10</span>
                    </div>
                </div>

                <!-- Fila Hora -->
                <div class="mobile-tight flex items-center space-x-3 bg-black/40 p-3 rounded-xl border border-white/5">
                    <span class="text-2xl drop-shadow-md opacity-90">🕒</span>
                    <div>
                        <span class="mobile-label block text-[10px] md:text-xs text-orange-400 font-bold uppercase tracking-[0.2em] mb-0.5">Hora</span>
                        <span class="mobile-value font-cormorant text-lg md:text-2xl text-gray-100 font-bold leading-none">23:00 hs</span>
                    </div>
                </div>
            </div>

            <!-- Fila Lugar -->
            <div class="mobile-tight flex items-center space-x-3 bg-black/40 p-3 rounded-xl border border-white/5">
                <span class="text-2xl drop-shadow-md opacity-90">📍</span>
                <div>
                    <span class="mobile-label block text-[10px] md:text-xs text-orange-400 font-bold uppercase tracking-[0.2em] mb-0.5">Lugar</span>
                    <span class="mobile-value font-cormorant text-lg md:text-2xl text-gray-100 font-bold leading-none">Mayor Arturo Luisone 60</span><br>
                    <span class="mobile-value font-cormorant text-lg md:text-2xl text-gray-100 font-bold leading-none">(Casa de Tobers)</span>
                </div>
            </div>

        </div>

        <div class="mt-8 grid grid-cols-2 gap-3">
            <a href="https://maps.app.goo.gl/Urjq3hSxpSBApR528" target="_blank" rel="noopener noreferrer"
               class="flex justify-center items-center gap-2 bg-gradient-to-r from-orange-700 to-orange-500 hover:from-orange-600 hover:to-orange-400 text-white font-black py-3 px-3 rounded-xl text-[11px] md:text-sm uppercase tracking-wider transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(255,100,0,0.4)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Ver en Maps
            </a>

            <button onclick="window.open('https://wa.me/543777676589?text=Voy%20perritooo%F0%9F%A4%99', '_blank')"
                class="flex justify-center items-center gap-2 bg-gradient-to-r from-orange-700 to-orange-500 hover:from-orange-600 hover:to-orange-400 text-white font-black py-3 px-3 rounded-xl text-[11px] md:text-sm uppercase tracking-wider transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(255,100,0,0.4)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M20.52 3.48A11.86 11.86 0 0 0 12.06 0C5.47 0 .08 5.39.08 12c0 2.12.55 4.2 1.6 6.03L0 24l6.12-1.6A11.95 11.95 0 0 0 12.06 24c6.59 0 11.98-5.39 11.98-12 0-3.19-1.24-6.2-3.52-8.52ZM12.06 21.8c-1.9 0-3.78-.51-5.42-1.48l-.39-.23-3.63.95 1-3.53-.25-.38A9.76 9.76 0 0 1 2.3 12c0-5.39 4.37-9.76 9.76-9.76 2.61 0 5.06 1.02 6.9 2.87A9.7 9.7 0 0 1 21.82 12c0 5.39-4.37 9.8-9.76 9.8Zm5.37-7.32c-.29-.15-1.73-.85-1.99-.95-.27-.1-.46-.15-.65.15-.19.29-.74.95-.9 1.14-.17.19-.33.21-.62.06-.29-.15-1.22-.45-2.33-1.43-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.33.43-.5.14-.17.19-.29.29-.48.1-.19.05-.36-.02-.5-.08-.15-.65-1.57-.89-2.15-.24-.57-.48-.49-.65-.5h-.55c-.19 0-.5.07-.76.36-.26.29-1 1-1 2.43 0 1.44 1.03 2.82 1.18 3.01.15.19 2.02 3.09 4.9 4.33.69.3 1.22.48 1.64.62.69.22 1.31.19 1.8.12.55-.08 1.73-.7 1.98-1.38.24-.67.24-1.25.17-1.38-.08-.12-.27-.19-.56-.34Z"/>
                </svg>
                Confirmar asistencia
            </button>
        </div>

        <!-- Notas Finales -->
        <div class="mt-8 border-t border-orange-500/20 pt-6 flex flex-col space-y-3 text-center">
            <div>
                <span class="block text-xs text-orange-500 font-black uppercase tracking-widest mb-1">Dress Code</span>
                <span class="wave-text font-cormorant text-xl text-gray-200 font-bold" aria-label="Disfraz obligatorio">
                    <span style="--i: 0;">D</span><span style="--i: 1;">i</span><span style="--i: 2;">s</span><span style="--i: 3;">f</span><span style="--i: 4;">r</span><span style="--i: 5;">a</span><span style="--i: 6;">z</span>
                    <span style="--i: 7;"> </span>
                    <span style="--i: 8;">o</span><span style="--i: 9;">b</span><span style="--i: 10;">l</span><span style="--i: 11;">i</span><span style="--i: 12;">g</span><span style="--i: 13;">a</span><span style="--i: 14;">t</span><span style="--i: 15;">o</span><span style="--i: 16;">r</span><span style="--i: 17;">i</span><span style="--i: 18;">o</span>
                </span>
            </div>
            <div>
                <span class="font-cormorant text-2xl text-orange-300 font-black">Traer bebidas 🍻</span>
            </div>
        </div>

    </div>

</body>
</html>
